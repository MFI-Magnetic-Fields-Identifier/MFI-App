[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mfi-cv"
version = "0.1.0"
description = "Módulo de visão computacional do MFI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy==2.1.9", "alembic==1.20.1", "Pillow==13.0.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]
postgres = ["psycopg[binary]==3.3.9"]
training = ["torch==2.14.0", "torchvision==0.29.2"]
api = ["fastapi==0.165.0", "pydantic==2.14.4", "uvicorn==0.54.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
